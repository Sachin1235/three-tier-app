apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
      - name: backend-app
        image: 757077150713.dkr.ecr.ap-south-1.amazonaws.com/backend-app:latest
        ports:
        - containerPort: 8085

